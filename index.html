<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<meta name="theme-color" content="#1a3a2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kur'an-ı Kerim">
<meta name="viewport"  content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=1.0, maximum-scale=5.0">
<title>القرءان الكريم</title>
<style>
@font-face {
  font-family: 'Scheherazade New';
  src: url('ScheherazadeNew-Regular.woff2') format('woff2');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Scheherazade New';
  src: url('ScheherazadeNew-Medium.woff2') format('woff2');
  font-weight: 500; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Scheherazade New';
  src: url('ScheherazadeNew-Bold.woff2') format('woff2');
  font-weight: 700; font-style: normal; font-display: swap;
}
:root {
  --bg: #fdf8f0;
  --bg2: #f5ede0;
  --paper: #fffdf7;
  --green: #2d7a4f;
  --green-light: #e8f5ee;
  --green-select: #f0fff0;
  --gold: #b8860b;
  --gold-light: #f5e6b8;
  --text: #1a1a1a;
  --text2: #444;
  --border: #d4c49a;
  --shadow: rgba(0,0,0,0.12);
  --header-h: 64px;
  --footer-h: 60px;
  --font-quran: 'Scheherazade New', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-quran); }

/* HEADER */
#header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
  background: linear-gradient(135deg, #1a3a2a 0%, #2d5a3d 50%, #1a3a2a 100%);
  display: flex; align-items: center; justify-content: center;
  gap: 28px; z-index: 100;
  border-bottom: 2px solid var(--gold);
  box-shadow: 0 2px 16px rgba(0,0,0,0.3);
}
.header-item {
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; padding: 6px 14px; border-radius: 8px;
  transition: background 0.2s;
  color: #e8d9b0;
  user-select: none;
}
.header-item:hover { background: rgba(255,255,255,0.1); }
.header-item .label { font-size: 11px; color: #a0c8a0; letter-spacing: 0.5px; font-family: var(--font-quran); }
.header-item .value { font-size: 20px; font-weight: 700; color: var(--gold-light); font-family: var(--font-quran); line-height: 1.2; }
.header-sep { width: 1px; height: 36px; background: rgba(255,255,255,0.2); }

/* MAIN */
#main {
  position: fixed; top: var(--header-h); bottom: var(--footer-h); left: 0; right: 0;
  overflow: hidden; touch-action: pan-x pan-y pinch-zoom;
}
#page-container {
  width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden;
  padding: 24px 20px 20px;
  background: var(--paper);
  transition: opacity 0.25s;
}
#page-container::-webkit-scrollbar { width: 5px; }
#page-container::-webkit-scrollbar-track { background: var(--bg2); }
#page-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* QURAN TEXT */
#quran-content { direction: rtl; }
.surah-header {
  text-align: center; margin: 28px 0 6px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.surah-title-frame { cursor: pointer; 
  border: 2px solid var(--gold);
  border-radius: 8px;
  padding: 6px 32px;
  background: linear-gradient(135deg, #fffbf0, #fff8e0);
  box-shadow: 0 2px 8px rgba(184,134,11,0.15);
  display: inline-block;
}
.surah-title-frame h1 {
  color: var(--green);
  font-family: var(--font-quran);
  font-size: 22px;
  font-weight: 700;
  margin: 0;
}
.basmala {
  font-family: var(--font-quran);
  font-size: 22px;
  color: var(--text);
  text-align: center;
  margin: 6px 0 12px;
  line-height: 1.8;
}
.ayah-num-ar {
  color: var(--green);
  font-family: var(--font-quran);
  font-size: 20px;
  cursor: pointer;
  display: inline;
  padding: 0 2px;
  border-radius: 3px;
  transition: background 0.15s;
  user-select: none;
}
.ayah-num-ar:hover { background: var(--green-light); }
/* Ruku ayet numarası renkleri: tek=yeşil (varsayılan), çift=mor */
.ruku-group { display: inline; }
.ruku-even .ayah-num-ar { color: #7c3aed; }
.ruku-even .ayah-num-ar:hover { background: #ede9fe; }
.ayah-span {
  display: inline;
  font-family: var(--font-quran);
  font-size: 22px;
  line-height: 2.3;
  cursor: pointer;
  padding: 1px 3px;
  border-radius: 4px;
  transition: background 0.15s;
}
.ayah-span.selected { background: var(--green-select); }
.ayah-span:hover { background: #f5fff5; }
.ayah-block { display: inline; }

.meal-row {
  display: none; direction: ltr; text-align: left;
  background: #f8fffe; border-right: 3px solid var(--green);
  padding: 8px 12px 8px 10px; margin: 6px 0 4px;
  border-radius: 0 6px 6px 0; overflow: hidden;
}
.meal-row.visible { display: block; }
.word-meal-row {
  display: none; direction: rtl;
  background: #f0f8ff; border-right: 3px solid #5599bb;
  padding: 8px 12px; margin: 4px 0 2px;
  border-radius: 0 6px 6px 0;
}
.word-meal-row.visible { display: block; }
.wbw-container {
  display: flex; flex-wrap: wrap; gap: 6px 10px;
  direction: rtl; align-items: flex-start;
}
.wbw-word {
  display: inline-flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 4px 6px;
  background: #fff; border: 1px solid #c5ddf0;
  border-radius: 6px; min-width: 46px;
}
.wbw-ar {
  font-family: var(--font-quran); font-size: 18px; color: var(--text);
  direction: rtl; line-height: 1.6;
}
.wbw-en {
  font-family: sans-serif; font-size: 11px; color: #336699;
  direction: ltr; text-align: center; line-height: 1.3;
  white-space: nowrap;
}
.wbw-tr {
  font-family: sans-serif; font-size: 12px; color: #2d5a3d;
  direction: ltr; text-align: center; line-height: 1.3;
}
.wbw-num {
  font-family: sans-serif; font-size: 10px; color: #aaa;
  text-align: center; line-height: 1;
}
.meal-num { font-weight: 700; color: var(--green); margin-left: 6px; font-family: sans-serif; font-size: 14px; }
.meal-text { font-family: sans-serif; font-size: 16px; color: var(--text2); direction: ltr; }
.meal-source { font-family: sans-serif; font-size: 11px; color: #aaa; direction: ltr; font-style: italic; float: right; margin-top: 4px; }
.tafsir-toggle {
  display: none; direction: ltr; text-align: left;
  color: var(--gold); cursor: pointer; font-size: 13px;
  padding: 5px 12px 5px 10px; user-select: none;
  margin-bottom: 13px;
  font-family: sans-serif; margin: 8px 0 6px;
  border-left: 3px solid var(--gold);
  background: #fffdf5; border-radius: 0 4px 4px 0;
  font-weight: 600; letter-spacing: 0.3px;
}
.tafsir-toggle.visible { display: block; }
.tafsir-toggle:hover { background: #fff3cc; text-decoration: none; }
.tafsir-row {
  display: none; direction: ltr; text-align: left;
  background: #fffbf0; border-right: 3px solid var(--gold);
  padding: 10px 14px; margin: 13px 0; border-radius: 0 6px 6px 0;
  font-size: 14px; color: #333; font-family: sans-serif; line-height: 1.8;
  max-height: 60vh; overflow-y: auto;
}
.tafsir-row p { margin-bottom: 6px; }
.tafsir-row.visible { display: block; }

.sura-accordion {
  border-top: 1px solid var(--border);
  overflow: hidden;
}
.sura-accordion-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 2px; cursor: pointer; user-select: none;
  font-size: 12px; font-weight: 700; color: var(--gold);
  letter-spacing: 0.4px; font-family: sans-serif;
}
.sura-accordion-header:hover { color: #e8c060; }
.sura-accordion-arrow {
  transition: transform 0.25s; font-size: 10px; color: var(--gold);
}
.sura-accordion-header.open .sura-accordion-arrow { transform: rotate(180deg); }
.sura-accordion-body {
  max-height: 0; overflow: hidden;
  transition: max-height 0.3s ease;
  font-size: 14px; line-height: 1.8; color: #333;
  font-family: sans-serif;
}
.sura-accordion-body.open { max-height: 2000px; }
.sura-accordion-body p { margin: 0 0 10px; }

.sura-info-card {
  background: #f8fffe; border: 1px solid var(--green-light);
  border-radius: 8px; padding: 8px 12px; text-align: center;
}
.sura-info-label { font-size: 11px; color: #888; margin-bottom: 2px; display: block; }
.sura-info-val { font-weight: 700; color: var(--green); font-size: 15px; display: block; }

/* FOOTER */
#footer {
  position: fixed; bottom: 0; left: 0; right: 0; height: var(--footer-h);
  background: linear-gradient(135deg, #1a3a2a 0%, #2d5a3d 50%, #1a3a2a 100%);
  display: flex; align-items: center; justify-content: space-around;
  border-top: 2px solid var(--gold);
  z-index: 100;
}

.footer-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: #a0c8a0; cursor: pointer; padding: 6px 20px;
  border-radius: 8px; transition: all 0.2s; border: none; background: none;
  font-family: var(--font-quran);
}
.footer-btn:hover { background: rgba(255,255,255,0.1); color: #e8d9b0; }
.footer-btn i { font-size: 20px; }
.footer-btn span { font-size: 11px; font-family: sans-serif; }
.footer-btn.active { color: var(--gold-light); }

/* LOADING */
#loading {
  position: fixed; inset: 0; background: rgba(253,248,240,0.95);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 999; gap: 16px;
}
#loading .spin { font-size: 40px; color: var(--green); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading p { font-size: 20px; color: var(--text2); font-family: var(--font-quran); }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  z-index: 200; display: none; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--paper); border-radius: 14px;
  width: min(480px, 94vw); max-height: 80vh;
  overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  border: 1px solid var(--border);
}
.modal-header {
  padding: 14px 18px; background: linear-gradient(135deg, #1a3a2a, #2d5a3d);
  color: #e8d9b0; display: flex; align-items: center; justify-content: space-between;
  font-family: var(--font-quran); font-size: 18px;
}
.modal-close { cursor: pointer; color: #a0c8a0; font-size: 20px; line-height: 1; border: none; background: none; }
.modal-close:hover { color: #fff; }
.modal-search { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.modal-search input {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 15px; outline: none;
  font-family: var(--font-quran); background: var(--bg);
}
.modal-list {
  overflow-y: auto; padding: 8px;
  flex: 1;
}
.modal-list::-webkit-scrollbar { width: 5px; }
.modal-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.modal-item {
  padding: 10px 14px; cursor: pointer; border-radius: 8px;
  display: flex; align-items: center; gap: 12px;
  transition: background 0.15s;
  direction: rtl;
}
.modal-item:hover { background: var(--green-light); }
.modal-item .num { font-size: 18px; color: var(--green); font-family: var(--font-quran); min-width: 36px; text-align: center; }
.modal-item .name { font-size: 17px; font-family: var(--font-quran); }
.modal-item .sub { font-size: 12px; color: #888; font-family: sans-serif; margin-right: auto; }

/* SEARCH MODAL */
#search-modal .modal-box { width: min(600px, 96vw); }
#search-query-input {
  width: 100%; padding: 10px 14px; font-size: 16px;
  border: 1px solid var(--border); border-radius: 8px;
  outline: none; font-family: sans-serif; background: var(--bg);
}
#search-count { text-align: center; font-size: 20px; font-weight: 700; color: var(--green); padding: 10px; font-family: sans-serif; }
.search-result-item {
  padding: 12px 14px; border-radius: 8px; cursor: pointer;
  border-bottom: 1px solid #eee; transition: background 0.15s;
  direction: rtl;
}
.search-result-item:hover { background: var(--green-light); }
.search-result-item .sr-text { font-size: 18px; font-family: sans-serif; line-height: 1.8; margin-bottom: 4px; }
.search-result-item .sr-tafsir-text { font-size: 14px; font-family: sans-serif; line-height: 1.6; color: #333; }
.sr-type-quran { color: #1a5a9a !important; }
.sr-type-meal { color: #2d7a4f !important; }
.sr-type-tafsir { color: #8b5e00 !important; }
.sr-more-btn {
  text-align: center; padding: 10px; cursor: pointer;
  color: var(--green); font-family: sans-serif; font-size: 14px;
  border-top: 1px solid var(--border); margin-top: 4px;
}
.sr-more-btn:hover { background: var(--green-light); }
.sr-divider { text-align: center; font-size: 12px; color: #aaa; padding: 8px 0; font-family: sans-serif; border-top: 1px solid var(--border); margin: 4px 0; }
.search-result-item .sr-meta-ar { font-size: 15px; font-family: var(--font-quran); color: var(--green); margin-bottom: 2px; direction: rtl; }
.search-result-item .sr-meta { font-size: 13px; color: #666; font-family: sans-serif; direction: ltr; }
.modal-item.active { background: var(--green-light); font-weight: 700; }
.modal-item.active .num, .modal-item.active .name { color: var(--green); }

/* EZBER MODAL */
#ezber-modal .modal-box { width: min(520px, 96vw); }
.ezber-tabs { display: flex; border-bottom: 2px solid var(--border); background: var(--bg2); }
.ezber-tab {
  flex: 1; padding: 12px 8px; border: none; background: none;
  cursor: pointer; font-size: 14px; font-family: sans-serif;
  color: var(--text2); transition: all 0.2s; border-bottom: 3px solid transparent;
  margin-bottom: -2px; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.ezber-tab:hover { background: var(--green-light); color: var(--green); }
.ezber-tab.active { color: var(--green); font-weight: 700; border-bottom: 3px solid var(--green); background: var(--paper); }
.ezber-panel { display: none; }
.ezber-panel.active { display: block; }
.settings-body { padding: 18px; display: flex; flex-direction: column; gap: 16px; direction: ltr; }
.settings-row { display: flex; flex-direction: column; gap: 6px; }
.settings-row label { font-size: 14px; color: var(--text2); font-family: sans-serif; font-weight: 600; }
.settings-row select, .settings-row input[type=number] {
  padding: 8px 12px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 14px; outline: none;
  font-family: var(--font-quran); background: var(--bg);
}
.settings-row .range-row { display: flex; gap: 10px; align-items: center; }
.settings-row .range-row span { font-size: 13px; color: #888; }
.ezber-coming-soon {
  padding: 40px 20px; text-align: center; color: var(--text2);
  font-family: sans-serif; font-size: 15px; direction: ltr;
}
.ezber-coming-soon i { font-size: 36px; color: var(--border); display: block; margin-bottom: 12px; }
.btn-apply {
  padding: 12px; background: var(--green); color: #fff;
  border: none; border-radius: 8px; cursor: pointer;
  font-size: 16px; font-family: sans-serif; font-weight: 600;
  transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-apply:hover { background: #235f3d; }
.ezber-github-link {
  display: block; text-align: center; margin-top: 12px;
  color: #888; font-size: 12px; font-family: sans-serif;
  text-decoration: none; transition: color 0.2s;
}
.ezber-github-link:hover { color: var(--green); }
.ezber-github-link i { margin-right: 4px; }

/* SEARCH MINIMIZED */
#search-bar {
  display: none; direction: ltr; position: fixed;
  bottom: var(--footer-h); left: 0; right: 0; z-index: 150;
  background: #fff; border-top: 1px solid var(--border);
  padding: 8px 14px; gap: 8px; align-items: center;
  box-shadow: 0 -4px 12px var(--shadow);
}
#search-bar.open { display: flex; }
#search-bar input { flex: 1; padding: 7px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 15px; outline: none; font-family: var(--font-quran); }
#search-bar .sb-btn { background: none; border: none; cursor: pointer; color: var(--green); font-size: 20px; padding: 4px; }

/* U+06DF — Kuran tilavet işareti, sukun'dan ayırt etmek için renk */
.ayah-span ۟, .basmala ۟ {
  color: #c87533;
}
/* CSS unicode-range ile sadece bu karakteri hedefle */
.quran-special {
  font-size: 1em;
  font-weight: 100;
  opacity: 0.33;
}

/* OKU MODU - bulanık ayet */
.ayah-blur .ayah-span { filter: blur(5px); cursor: pointer; user-select: none; }
.ayah-blur .ayah-span:hover { filter: blur(4px); }
.oku-word { display: inline; transition: filter 0.2s; }
.oku-word.revealed { filter: none !important; }
.ayah-blur .ayah-span { filter: blur(5px); cursor: pointer; }
.ayah-active-oku .ayah-span { filter: none; }
.oku-active-border { outline: 2px solid var(--gold); border-radius: 4px; }

/* YAZ MODU */
#yaz-keyboard {
  display: none; position: fixed; bottom: var(--footer-h); left: 0; right: 0;
  background: #1a3a2a; border-top: 2px solid var(--gold);
  padding: 5px 4px 4px; z-index: 150; direction: rtl;
}
#yaz-keyboard.open { display: block; }
.yaz-kb-row { display: flex; justify-content: center; gap: 3px; margin-bottom: 3px; }
.yaz-key {
  width: calc((100vw - 30px) / 11);
  max-width: 42px;
  height: 34px; border-radius: 5px;
  background: #2d5a3d; border: 1px solid #4a8a5d;
  color: #e8d9b0; font-family: var(--font-quran); font-size: 17px;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  transition: background 0.1s; user-select: none; flex-shrink: 0;
}
.yaz-key:hover { background: #3d7a55; }
.yaz-key:active { background: var(--gold); color: #1a1a1a; transform: scale(0.92); }
.yaz-char { display: inline; }
.yaz-char.blurred { filter: blur(5px); }
.yaz-char.revealed { filter: none; }

/* AUDIO indicator */
.ayah-span.playing { background: #fff3cd !important; outline: 2px solid var(--gold); }

/* Page transition */
.fade-out { opacity: 0; }
.fade-in { opacity: 1; }

@media (max-width: 600px) {
  .header-item .value { font-size: 17px; }
  #header { gap: 14px; }
  .ayah-span { font-size: 23px; }
  .basmala { font-size: 23px; }
  .surah-title-frame h1 { font-size: 23px; }
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <i class="fa-solid fa-spinner spin"></i>
  <p>أَعُوذُ بٱللَّهِ مِنَ ٱلشَّيْطَانِ ٱلرَّجِيمِ</p>
</div>

<!-- HEADER -->
<header id="header">
  <div class="header-item" id="hdr-surah" title="Sure seç">
    <span class="label">السورة</span>
    <span class="value" id="hdr-surah-name">—</span>
  </div>
  <div class="header-sep"></div>
  <div class="header-item" id="hdr-page" title="Sayfa seç">
    <span class="label">الصفحة</span>
    <span class="value" id="hdr-page-num">—</span>
  </div>
  <div class="header-sep"></div>
  <div class="header-item" id="hdr-juz" title="Cüz seç">
    <span class="label">الجزء</span>
    <span class="value" id="hdr-juz-num">—</span>
  </div>
</header>

<!-- MAIN -->
<main id="main">
  <div id="page-container">
    <div id="quran-content"></div>
  </div>
</main>

<!-- FOOTER -->
<footer id="footer">
  <button class="footer-btn" id="btn-search">
    <i class="fa-solid fa-magnifying-glass"></i>
    <span>Ara</span>
  </button>
  <button class="footer-btn" id="btn-play">
    <span id="play-label" style="font-family:var(--font-quran);font-size:15px;font-weight:700;color:#e8d9b0;line-height:1.3;letter-spacing:0.5px">بسم الله الرحمن الرحيم</span>
  </button>
  <button class="footer-btn" id="btn-menu">
    <i class="fa-solid fa-book-open"></i>
    <span>Ezber</span>
  </button>
</footer>

<!-- YAZ MODU KLAVYE -->

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      window._wakeLock = await navigator.wakeLock.request('screen');
      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible') {
          window._wakeLock = await navigator.wakeLock.request('screen');
        }
      });
    }
  } catch(e) {}
}

// ===================== TAFSIR DATA =====================
async function loadTafsirData() {
  try {
    const res = await fetch('tafsir.json?v=3');
    if (!res.ok) return;
    tafsirData = await res.json();
    tafsirDataLoaded = true;
  } catch(e) {}
}

function getTafsir(key) {
  if (!tafsirDataLoaded) return null;
  const toObj = val => {
    if (!val) return null;
    if (typeof val === 'object') return val;
    return { arabic: '', turkish: val };
  };
  if (tafsirData[key]) return toObj(tafsirData[key]);
  // Bulunamazsa önceki ayetlere geri dön
  const [sura, ayah] = key.split('_').map(Number);
  for (let i = ayah - 1; i >= 1; i--) {
    const prev = tafsirData[`${sura}_${i}`];
    if (prev) return toObj(prev);
  }
  return null;
}

// ===================== WORD DATA =====================
async function loadWordData() {
  try {
    const res = await fetch('words.json?v=3');
    if (!res.ok) return; // dosya yoksa sessizce geç
    wordData = await res.json();
    wordDataLoaded = true;
    // Eğer açık bir meal varsa güncelle
    openMealKeys.forEach(key => refreshWordMeal(key));
  } catch(e) {
    // words.json yok veya hata - kelime meali devre dışı
  }
}

function refreshWordMeal(key) {
  const wmEl = document.getElementById('wm-' + key);
  if (!wmEl) return;
  const [sn, an] = key.split('_');
  const words = wordData[key];
  if (!words || words.length === 0) return;
  renderWordMeal(wmEl, words);
}

function renderWordMeal(wmEl, trWords) {
  const key = wmEl.id.replace('wm-', '');
  const ayahSpan = document.querySelector(`.ayah-span[data-key="${key}"]`);

  // Ayet metnini DOM'dan al
  let arWords = [];
  if (ayahSpan) {
    const rawText = ayahSpan.textContent;
    const ARABIC_LETTER = /[\u0621-\u06D5]/;
    arWords = rawText.split(/\s+/).filter(t => ARABIC_LETTER.test(t));
  }

  // * olan kelimelerin Arapça metnini önceki karta ekle
  // Önce kartları oluştur: her kart {arParts: [], tr: string}
  let cardGroups = [];
  trWords.forEach((tr, i) => {
    const ar = arWords[i] || '';
    const isStar = !tr || tr === '*';
    if (isStar && cardGroups.length > 0) {
      // Önceki karta Arapça ekle
      cardGroups[cardGroups.length - 1].arParts.push(ar);
    } else {
      cardGroups.push({ arParts: [ar], tr: isStar ? '' : tr });
    }
  });

  const cards = cardGroups.map(g => {
    const arText = g.arParts.filter(Boolean).join(' ');
    if (!arText && !g.tr) return '';
    return `<span class="wbw-word">
      <span class="wbw-ar">${arText}</span>
      ${g.tr ? `<span class="wbw-tr">${g.tr}</span>` : ''}
    </span>`;
  }).join('');

  if (!cards) return;
  wmEl.innerHTML = `<div class="wbw-container">${cards}</div>`;
  wmEl.classList.add('visible');
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('Fetch failed: ' + url);
  return r.json();
}

// ===================== INIT =====================
async function init() {
  showLoading(true);
  try {
    // Yerel Kur'an verisi yükle
    let qdata;
    if (typeof QURAN_DATA !== 'undefined') {
      qdata = QURAN_DATA;
    } else {
      qdata = await fetchJSON('quran-data-full.json');
    }

    // pageMap, juzFirstPage, surahFirstPage direkt yükle
    allSurahs = qdata.surahs;

    // JSON key'leri string olabilir, integer'a çevir
    for (const [k, v] of Object.entries(qdata.pageMap))
      pageMap[parseInt(k)] = v;
    for (const [k, v] of Object.entries(qdata.juzFirstPage))
      juzFirstPage[parseInt(k)] = v;
    for (const [k, v] of Object.entries(qdata.surahFirstPage))
      surahFirstPage[parseInt(k)] = v;

    // Kelime meali veritabanını arka planda yükle
    loadWordData();
    // Tefsir veritabanını arka planda yükle
    loadTafsirData();
    // Sa'di mealini arka planda yükle
    loadSadiMeal();
    // Sure bilgilerini arka planda yükle
    loadSuraInfo();

    buildModals();
    await loadPage(currentPage, 'first', false);
  } catch(e) {
    document.getElementById('quran-content').innerHTML = '<p style="color:red;font-family:sans-serif;padding:20px">Hata: '+e.message+'</p>';

  showLoading(false);

// ===================== PAGE RENDER =====================
async function loadPage(pageNum, selectMode = 'first', fade = true) {
  // selectMode: 'first' | {surah, ayah} | null
  pageNum = Math.max(1, Math.min(604, pageNum));
  currentPage = pageNum;
  localStorage.setItem('quran_page', pageNum);

  const blocks = pageMap[pageNum];
  if (!blocks || blocks.length === 0) return;

  if (fade) {
    const pc = document.getElementById('page-container');
    pc.style.opacity = '0';
    await new Promise(r => setTimeout(r, 150));
  }

  renderPage(blocks);
  updateHeader(pageNum, blocks);

  // Determine which ayah to select
  let selectKey = null;
  if (selectMode === 'first') {
    const firstBlock = blocks[0];
    if (firstBlock && firstBlock.ayahs.length > 0) {
      selectKey = `${firstBlock.surahNumber}_${firstBlock.ayahs[0].numberInSurah}`;
    }
  } else if (selectMode && typeof selectMode === 'object') {
    selectKey = `${selectMode.surah}_${selectMode.ayah}`;
  }
  selectedAyahKey = selectKey;

  if (fade) {
    const pc = document.getElementById('page-container');
    pc.style.transition = 'opacity 0.25s';
    pc.style.opacity = '1';
    setTimeout(() => pc.style.transition = '', 300);
  }

  // Apply selection highlight after render
  setTimeout(() => applySelection(), 10);
  document.getElementById('page-container').scrollTop = 0;

  // Oku veya yaz modu aktifse sayfada bulanıklığı yeniden uygula
  if (okuMode) setTimeout(() => applyOkuMode(), 20);
  if (yazMode) setTimeout(() => applyYazMode(), 20);
}

const BASMALA_STANDARD = 'بِسۡمِ ٱللَّهِ ٱلرَّحۡمَـٰنِ ٱلرَّحِیمِ';
const BASMALA_95_97 = 'بِّسۡمِ ٱللَّهِ ٱلرَّحۡمَـٰنِ ٱلرَّحِیمِ';
const SURENAHMESIZ = new Set([1, 9]); // No basmala shown before (already in text or tawba)

function getBasmalaForSurah(surahNum) {
  if (surahNum === 95 || surahNum === 97) return BASMALA_95_97;
  if (surahNum === 1 || surahNum === 9) return null;
  return BASMALA_STANDARD;
}

function removeBasmalaFromText(text, surahNum) {
  if (surahNum === 1 || surahNum === 9) return text;
  let t = text.trim();
  // Besmele sonu: رَّحِيمِ (raheem) - tam unicode ile ara
  const RAHEEM = '\u0631\u0651\u064e\u062d\u0650\u064a\u0645\u0650';
  const idx = t.indexOf(RAHEEM);
  if (idx !== -1) {
    t = t.slice(idx + RAHEEM.length).trim();
  }
  return t;
}

function wrapSpecialChars(text) {
  // U+06DF (Small High Rounded Zero) - tilavet işareti, sukundan ayırt et
  return text.replace(/۟/g, '<span class="quran-special">۟</span>');
}

function renderPage(blocks) {
  const container = document.getElementById('quran-content');
  let html = '';

  for (const block of blocks) {
    const sn = block.surahNumber;

    // Sure başlığı - sadece bu sayfada numberInSurah=1 olan ayet varsa
    const hasFirstAyah = block.ayahs.some(a => a.numberInSurah === 1);
    if (hasFirstAyah) {
      const basmala = getBasmalaForSurah(sn);
      html += `<div class="surah-header">`;
      html += `<div class="surah-title-frame" data-surah="${sn}"><h1>${block.surahName}</h1></div>`;
      if (basmala) html += `<div class="basmala">${wrapSpecialChars(basmala)}</div>`;
      html += `</div>`;
    }

    // Ayetler - düz yazı (inline)
    let currentRuku = null;
    html += `<div class="page-block" data-surah="${sn}" style="text-align:justify;direction:rtl;margin-bottom:8px;">`;
    for (const ayah of block.ayahs) {
      if (ayah.ruku !== currentRuku) {
        if (currentRuku !== null) html += `</div>`;
        currentRuku = ayah.ruku;
        const rukuClass = currentRuku % 2 === 0 ? 'ruku-even' : 'ruku-odd';
        html += `<div class="ruku-group ${rukuClass}" data-ruku="${currentRuku}">`;
      }
      let text = ayah.text;
      // Besmele mantığı: numberInSurah=1 ise başındaki besmeleyi kaldır
      if (ayah.numberInSurah === 1) {
        text = removeBasmalaFromText(text, sn);
      }
      const key = `${sn}_${ayah.numberInSurah}`;
      const globalNum = ayah.number;
      html += `<span class="ayah-block" data-key="${key}" data-global="${globalNum}">`;
      html += `<span class="ayah-span" data-key="${key}">${wrapSpecialChars(text)}</span>`;
      html += `<span class="ayah-num-ar" data-key="${key}" data-global="${globalNum}" title="Meal için tıkla">﴿${toArabicNum(ayah.numberInSurah)}﴾</span>`;
      html += `</span>`;
      // Meal + Tefsir rows (hidden)
      html += `<div class="word-meal-row" id="wm-${key}"></div>`;
      html += `<div class="meal-row" id="meal-${key}">`;
      html += `<span class="meal-num">${ayah.numberInSurah}.</span>`;
      const sadiMealTxt = sadiMealLoaded ? (sadiMealData[key] || '') : '';
      html += `<span class="meal-text">${sadiMealTxt}</span>`;
      html += `<span class="meal-source">— Tefsîru's-Saʿdî Meali</span>`;
      html += `</div>`;
      html += `<div class="tafsir-toggle" id="tft-${key}">Tefsîru's-Saʿdî</div>`;
      html += `<div class="tafsir-row" id="tfs-${key}"></div>`;
    }
    if (currentRuku !== null) html += `</div>`;
    html += `</div>`;
  }

  container.innerHTML = html;
  attachPageEvents();
}

function attachPageEvents() {
  // Sure başlığı tıklama -> sure bilgi modalı
  document.querySelectorAll('.surah-title-frame').forEach(el => {
    el.addEventListener('click', () => {
      const sn = parseInt(el.dataset.surah);
      if (sn) openSuraInfoModal(sn);
    });
  });

  // Ayet metni tıklama
  document.querySelectorAll('.ayah-span').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const key = el.dataset.key;
      if (selectedAyahKey === key) return;
      selectedAyahKey = key;
      applySelection();
    });
  });

  // Ayet numarası tıklama -> meal
  document.querySelectorAll('.ayah-num-ar').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const key = el.dataset.key;
      toggleMeal(key);
    });
  });

  // Tefsir toggle
  document.querySelectorAll('.tafsir-toggle').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const key = el.id.replace('tft-', '');
      toggleTafsir(key);
    });
  });
}

function applySelection() {
  document.querySelectorAll('.ayah-span').forEach(el => {
    el.classList.toggle('selected', el.dataset.key === selectedAyahKey);
  });
  // Seçili ayetin suresini header'da güncelle
  if (selectedAyahKey) {
    const sn = parseInt(selectedAyahKey.split('_')[0]);
    const surah = allSurahs.find(s => s.number === sn);
    if (surah) document.getElementById('hdr-surah-name').textContent = surah.name;
  }
}

function closeAllMeals() {
  openMealKeys.forEach(k => {
    const m = document.getElementById('meal-' + k);
    const t = document.getElementById('tft-' + k);
    const tf = document.getElementById('tfs-' + k);
    const wm = document.getElementById('wm-' + k);
    if (m) m.classList.remove('visible');
    if (t) t.classList.remove('visible');
    if (tf) { tf.classList.remove('visible'); openTafsirKeys.delete(k); }
    if (wm) wm.classList.remove('visible');
  });
  openMealKeys.clear();
}

function toggleMeal(key) {
  const mealEl = document.getElementById('meal-' + key);
  const tftEl = document.getElementById('tft-' + key);
  if (!mealEl) return;
  const wasOpen = openMealKeys.has(key);
  closeAllMeals();
  if (!wasOpen) {
    openMealKeys.add(key);
    mealEl.classList.add('visible');
    if (tftEl) tftEl.classList.add('visible');
    loadWordMeal(key);
  }
}

async function loadWordMeal(key) {
  const wmEl = document.getElementById('wm-' + key);
  if (!wmEl) return;
  if (!wordDataLoaded) {
    // Henüz yüklenmedi - bekle ve tekrar dene
    await loadWordData();
  }
  const words = wordData[key];
  if (!words || words.length === 0) return;
  renderWordMeal(wmEl, words);
}

async function toggleTafsir(key) {
  const tfsEl = document.getElementById('tfs-' + key);
  if (!tfsEl) return;
  if (openTafsirKeys.has(key)) {
    openTafsirKeys.delete(key);
    tfsEl.classList.remove('visible');
    return;
  }
  openTafsirKeys.add(key);
  tfsEl.classList.add('visible');
  // data-loaded: bir kez yüklendikten sonra tekrar yükleme
  if (tfsEl.dataset.loaded === '1') return;
  tfsEl.dataset.loaded = '1';

  const [sura, ayah] = key.split('_').map(Number);
  tfsEl.innerHTML = '<p style="color:#aaa;font-family:sans-serif;font-size:13px">Tefsir yükleniyor...</p>';

  if (!tafsirDataLoaded) await loadTafsirData();
  const entry = getTafsir(key);
  if (entry) {
    const arabicText = entry.arabic || '';
    const turkishText = entry.turkish || '';
    const formatParas = txt => txt
      .replace(/\s*\n\s*/g, '\n').trim()
      .split('\n').map(l => l.trim()).filter(l => l.length > 2)
      .map(l => `<p style="margin:0 0 8px">${l}</p>`).join('');
    let html = '';
    if (arabicText) {
      html += `<div style="font-family:var(--font-quran);font-size:16px;direction:rtl;
          text-align:right;background:#f9f6ee;padding:10px;border-radius:6px;
          line-height:2;margin-bottom:10px">${formatParas(arabicText)}</div>`;
    }
    if (turkishText) {
      html += `<div style="font-family:sans-serif;font-size:13px;line-height:1.8;color:#333">
          ${formatParas(turkishText)}</div>`;
    }
    tfsEl.innerHTML = html || '<p style="color:#aaa;font-size:13px">İçerik bulunamadı.</p>';
  } else {
    tfsEl.textContent = 'Bu ayet için tefsir bulunamadı.';
  }
}

async function openSuraInfoModal(sn) {
  const surah = allSurahs.find(s => s.number === sn);
  if (!surah) return;

  document.getElementById('sura-info-title').innerHTML =
    `<span style="font-family:var(--font-quran)">${surah.name}</span>`;
  document.getElementById('sura-info-content').innerHTML =
    '<div style="color:#aaa;font-size:13px;padding:16px">Yükleniyor...</div>';
  openModal('sura-info-modal');

  if (!suraInfoLoaded) await loadSuraInfo();
  const info = suraInfoData[String(sn)] || {};

  // Bilgi kartları
  const cards = [
    ['Toplam Ayet', info['Toplam Ayet Sayısı'] || surah.numberOfAyahs || '?'],
    ['Mushaf Sırası', info['Mushaf Sırası'] || sn],
    ['Nüzul Sırası', info['Nüzul Sırası'] || '?'],
    ['Cüz', getSuraJuz(sn)],
  ];

  let html = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
    ${cards.map(([l,v]) => `
      <div class="sura-info-card">
        <div class="sura-info-label">${l}</div>
        <div class="sura-info-val">${v}</div>
      </div>`).join('')}
  </div>`;

  // İçerik bölümleri - akordion
  const sections = ['Hakkında','Nüzul','Konusu','Fazileti'];
  const icons = {'Hakkında':'📖','Nüzul':'🌙','Konusu':'📌','Fazileti':'⭐'};
  for (const sec of sections) {
    if (!info[sec]) continue;
    const paras = info[sec].split('\n').filter(l => l.trim().length > 2)
      .map(l => `<p>${l.trim()}</p>`).join('');
    const secId = 'acc-' + sec.replace(/[^a-z]/gi,'');
    html += `
      <div class="sura-accordion">
        <div class="sura-accordion-header" onclick="toggleAccordion('${secId}', this)">
          <span>${icons[sec] || ''} ${sec}</span>
          <span class="sura-accordion-arrow">▼</span>
        </div>
        <div class="sura-accordion-body" id="${secId}">
          <div style="padding-bottom:8px">${paras}</div>
        </div>
      </div>`;
  }

  html += `<div style="text-align:right;font-size:11px;color:#aaa;font-style:italic;
    border-top:1px solid var(--border);margin-top:12px;padding-top:8px;font-family:sans-serif">
    Kaynak: Diyanet İşleri Başkanlığı — Kur'an Yolu
  </div>`;
  document.getElementById('sura-info-content').innerHTML = html;
}



function toggleAccordion(id, headerEl) {
  const body = document.getElementById(id);
  if (!body) return;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  headerEl.classList.toggle('open', !isOpen);
}

function getSuraJuz(sn) {
  // Surenin ait olduğu cüzü bul
  const info = surahFirstPage[sn];
  if (!info) return '?';
  const page = info.page;
  let juz = 1;
  for (let j = 30; j >= 1; j--) {
    if (juzFirstPage[j] && page >= juzFirstPage[j]) { juz = j; break; }
  }
  return juz;
}

  });

function highlightModalItem(listId, selector) {
  const list = document.getElementById(listId);

  setTimeout(() => {

// Arama state
let searchAllResults = [];
let searchPageSize = 33;
let searchOffset = 0;

function highlightQ(text, q) {
  if (!q || !text) return text;
  try {
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    return text.replace(re, '<mark style="background:#fff3cd;padding:0 2px;border-radius:2px">$&</mark>');
  } catch(e) { return text; }
}

function navigateToAyah(sn, an) {
  let targetPage = surahFirstPage[sn] ? surahFirstPage[sn].page : 1;
  for (const [pg, blocks] of Object.entries(pageMap)) {
    for (const block of blocks) {
      if (block.surahNumber === sn && block.ayahs.some(a => a.numberInSurah === an)) {
        targetPage = parseInt(pg); break;
      }
    }
  }
  loadPage(targetPage, {surah: sn, ayah: an});
}

function renderSearchResults(q) {
  const rList = document.getElementById('search-results');
  const page = searchAllResults.slice(searchOffset, searchOffset + searchPageSize);
  let html = page.map(r => {
    const surahName = allSurahs[r.sura-1] ? allSurahs[r.sura-1].name : '';
    let typeLabel, typeClass, textHtml;
    if (r.type === 'quran') {
      typeLabel = "📖 Kur'an-ı Kerim"; typeClass = 'sr-type-quran';
      textHtml = `<div class="sr-text" style="font-family:var(--font-quran);font-size:18px;direction:rtl">${highlightQ(r.text, q)}</div>`;
    } else if (r.type === 'meal') {
      typeLabel = '📗 Meal'; typeClass = 'sr-type-meal';
      textHtml = `<div class="sr-text">${highlightQ(r.text, q)}</div>`;
    } else {
      typeLabel = '📝 Tefsir'; typeClass = 'sr-type-tafsir';
      textHtml = `<div class="sr-text sr-tafsir-text">${r.text}</div>`;
    }
    return `<div class="search-result-item" data-sura="${r.sura}" data-ayah="${r.ayah}">
      ${textHtml}
      <div class="sr-meta-ar">${surahName}</div>
      <div class="sr-meta ${typeClass}">${typeLabel} &nbsp;|&nbsp; آية: ${r.ayah}</div>
    </div>`;
  }).join('');

  const remaining = searchAllResults.length - searchOffset - searchPageSize;
  if (remaining > 0) {
    html += `<div class="sr-more-btn" id="sr-more">Devamı... (${remaining} sonuç daha)</div>`;
  }

  if (searchOffset === 0) {
    rList.innerHTML = html;
  } else {
    const oldMore = rList.querySelector('#sr-more');
    if (oldMore) oldMore.remove();
    rList.insertAdjacentHTML('beforeend', html);
  }

  rList.querySelectorAll('.search-result-item:not([data-bound])').forEach(el => {
    el.dataset.bound = '1';
    el.addEventListener('click', () => navigateToAyah(parseInt(el.dataset.sura), parseInt(el.dataset.ayah)));
  });

  const moreBtn = document.getElementById('sr-more');
  if (moreBtn) {
    moreBtn.addEventListener('click', () => {
      searchOffset += searchPageSize;
      renderSearchResults(q);
    });
  }
}

async function doSearch() {
  const q = (document.getElementById('search-query-input').value || document.getElementById('search-input-bar').value).trim();
  if (!q) return;
  document.getElementById('search-query-input').value = q;
  document.getElementById('search-input-bar').value = q;
  const isArabic = /[\u0600-\u06FF]/.test(q);
  document.getElementById('search-count').textContent = 'Aranıyor...';
  document.getElementById('search-results').innerHTML = '';
  searchAllResults = [];
  searchOffset = 0;
  if (!document.getElementById('search-modal').classList.contains('open')) openModal('search-modal');
  try {
    const [quranResults, tafsirResults, mealResults] = await Promise.all([
      isArabic ? searchQuranText(q) : [],
      isArabic ? [] : searchTafsir(q),
      isArabic ? [] : searchSadiMeal(q)
    ]);
    quranResults.forEach(m => searchAllResults.push({ type: 'quran', sura: m.sura, ayah: m.ayah, text: m.text }));
    mealResults.forEach(m => searchAllResults.push({ type: 'meal', sura: m.sura, ayah: m.ayah, text: m.text }));
    tafsirResults.forEach(t => searchAllResults.push({ type: 'tafsir', sura: t.sura, ayah: t.ayah, text: t.snippet }));
    const total = searchAllResults.length;
    const qCount = searchAllResults.filter(r => r.type === 'quran').length;
    const mCount = searchAllResults.filter(r => r.type === 'meal').length;
    const tCount = searchAllResults.filter(r => r.type === 'tafsir').length;
    let countLabel = `${total} Sonuç`;
    const parts = [];
    if (qCount) parts.push(`${qCount} Kur'an`);
    if (mCount) parts.push(`${mCount} meal`);
    if (tCount) parts.push(`${tCount} tefsir`);
    if (parts.length) countLabel += ` (${parts.join(', ')})`;
    document.getElementById('search-count').textContent = countLabel;
    renderSearchResults(q);
  } catch(e) {
    document.getElementById('search-count').textContent = 'Hata: ' + e.message;
  }
}

function searchQuranText(q) {
  if (!q) return [];
  const qNorm = q.trim();
  const results = [];
  for (const surah of allSurahs) {
    for (const ayah of surah.ayahs) {
      if (ayah.text && ayah.text.includes(qNorm)) {
        results.push({ sura: surah.number, ayah: ayah.numberInSurah, text: ayah.text });
      }
    }
  }
  return results;
}

function searchSadiMeal(q) {
  if (!sadiMealLoaded || !q) return [];
  const qLower = q.toLowerCase().trim();
  const results = [];
  for (const [key, text] of Object.entries(sadiMealData)) {
    if (!text || !text.toLowerCase().includes(qLower)) continue;
    const [sura, ayah] = key.split('_').map(Number);
    results.push({ sura, ayah, text: highlightQ(text, q) });
  }
  return results;
}

function searchTafsir(q) {
  if (!tafsirDataLoaded || !q) return [];
  const qLower = q.toLowerCase().trim();
  const results = [];
  let re;
  try { re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); } catch(e) { re = null; }
  for (const [key, val] of Object.entries(tafsirData)) {
    if (!val) continue;
    const text = typeof val === 'object' ? (val.turkish || '') : val;
    if (!text || (text.length < 15 && /^\d+_\d+$/.test(text))) continue;
    const idx = text.toLowerCase().indexOf(qLower);
    if (idx === -1) continue;
    const [sura, ayah] = key.split('_').map(Number);
    const start = Math.max(0, idx - 60);
    const end = Math.min(text.length, idx + qLower.length + 120);
    let snippet = (start > 0 ? '...' : '') + text.slice(start, end).trim() + (end < text.length ? '...' : '');
    if (re) snippet = snippet.replace(re, '<mark style="background:#fff3cd;padding:0 2px;border-radius:2px">$&</mark>');
    results.push({ sura, ayah, snippet });
  }
  return results;
}

let basmalaPlayedForSurah = new Set();
let ezberMode = false;

// Ezber çalma state
let ezberSurah = 0;
let ezberFrom = 0;
let ezberTo = 0;
let ezberRepeat = 1;      // her ayet kaç kez
let ezberRepeatAll = 1;   // tüm aralık kaç kez (aynısını tekrar)
let ezberRepeatAllCurrent = 0;
let ezberCurrentAyah = 0; // şu an çalınan ayet index (from'dan itibaren)
let ezberCurrentRepeat = 0; // şu an kaçıncı tekrarda
let ezberReviewPhase = false; // kümülatif tekrar aşaması mı?
let ezberReviewIndex = 0;    // review'da kaçıncı ayette

function stopPlay() {

// Besmele çalınacak mı? Sure 1/9 ve başlangıç ayet=1 ise hayır
function ezberBasmalaGerekli() {
  return !((ezberSurah === 1 || ezberSurah === 9) && ezberFrom === 1);
}

// ── Ezber modu başlatma ────────────────────────────────────────────────────
function startEzberPlay() {
  isPlaying = true;
  ezberMode = true;
  basmalaPlayedForSurah = new Set();
  ezberSurah = parseInt(settings.surah);
  ezberFrom = settings.from;
  ezberTo = settings.to;
  ezberRepeat = settings.repeat || 1;
  ezberRepeatAll = settings.repeatAll || 1;
  ezberRepeatAllCurrent = 0;
  ezberCurrentAyah = 0;
  ezberCurrentRepeat = 0;
  ezberReviewPhase = false;
  ezberReviewIndex = 0;

  // ikon kaldırıldı
  document.getElementById('play-label').textContent = 'صدق الله العظيم';
  document.getElementById('btn-play').classList.add('active');

  const reciter = settings.reciter || 'Husary_128kbps_Mujawwad';
  // Önce euzu çal
  playAudioUrl(`https://everyayah.com/data/${reciter}/001000.mp3`, () => {
    // Sonra besmele (sure 1/9 ve başlangıç=1 ise atla)
    if (ezberBasmalaGerekli()) {
      playAudioUrl(`https://everyayah.com/data/${reciter}/001001.mp3`, () => ezberStep());
    } else {
      ezberStep();
    }
  });
}

// ── Ezber adım motoru ──────────────────────────────────────────────────────
// State makinesi: her çağrıda bir sonraki sesi çalar
// Faz 1 (ana): mevcut ayeti ezberRepeat kez çal
// Faz 2 (review): besmele + ayet[from..currentAyah] birer kez
// Her iki faz bitince currentAyah++ → tekrar Faz1
// Tüm aralık bitince repeatAll kontrolü

function ezberStep() {
  if (!isPlaying) return;
  const reciter = settings.reciter || 'Husary_128kbps_Mujawwad';
  const totalAyahs = ezberTo - ezberFrom + 1;

  if (ezberReviewPhase) {
    // reviewIndex: -1 = besmele bekliyor, 0+ = o index'teki ayeti çal
    if (ezberReviewIndex < 0) {
      // Besmele çal, index'i 0'a çek
      if (ezberBasmalaGerekli()) {
        playAudioUrl(`https://everyayah.com/data/${reciter}/001001.mp3`, () => {
          ezberReviewIndex = 0;
          ezberStep();
        });
        return;
      } else {
        ezberReviewIndex = 0;
      }
    }

    if (ezberReviewIndex <= ezberCurrentAyah) {
      // Bu index'teki ayeti çal
      const ayahNum = ezberFrom + ezberReviewIndex;
      highlightAyah(ezberSurah, ayahNum, reciter);
      playAudioUrl(ayahUrl(ezberSurah, ayahNum, reciter), () => {
        ezberReviewIndex++;
        ezberStep();
      });
    } else {
      // Review bitti → bir sonraki ana ayete geç
      ezberReviewPhase = false;
      ezberCurrentAyah++;
      ezberCurrentRepeat = 0;

      if (ezberCurrentAyah >= totalAyahs) {
        // Tüm aralık tamamlandı
        ezberRepeatAllCurrent++;
        if (ezberRepeatAllCurrent < ezberRepeatAll) {
          // Aynısını tekrar: başa dön, euzu+besmele
          ezberCurrentAyah = 0;
          ezberCurrentRepeat = 0;
          playAudioUrl(`https://everyayah.com/data/${reciter}/001000.mp3`, () => {
            if (ezberBasmalaGerekli()) {
              playAudioUrl(`https://everyayah.com/data/${reciter}/001001.mp3`, () => ezberStep());
            } else {
              ezberStep();
            }
          });
        } else {
          stopPlay();
        }
        return;
      }
      ezberStep(); // Sonraki ayetin ana fazı
    }
    return;
  }

  // ── Ana faz: mevcut ayeti ezberRepeat kez çal ──
  if (ezberCurrentAyah >= totalAyahs) { stopPlay(); return; }

  const ayahNum = ezberFrom + ezberCurrentAyah;
  highlightAyah(ezberSurah, ayahNum, reciter);
  playAudioUrl(ayahUrl(ezberSurah, ayahNum, reciter), () => {
    ezberCurrentRepeat++;
    if (ezberCurrentRepeat < ezberRepeat) {
      ezberStep(); // Aynı ayeti tekrar
    } else {
      // Tekrar bitti → review fazına gir
      ezberCurrentRepeat = 0;
      ezberReviewPhase = true;
      ezberReviewIndex = -1; // -1: önce besmele
      ezberStep();
    }
  });
}

function ayahUrl(surah, ayah, reciter) {
  return `https://everyayah.com/data/${reciter}/${String(surah).padStart(3,'0')}${String(ayah).padStart(3,'0')}.mp3`;
}

function playAudioUrl(url, onEnd) {
  if (!isPlaying) return;
  audio.onended = null;
  audio.src = url;
  audio.onended = () => { if (isPlaying) onEnd(); };
  audio.play().catch(() => {});
}

// Oku modu için bağımsız ses çalma (isPlaying kontrolü yok)
function playOkuAudio(url, onEnd) {
  audio.onended = null;
  audio.src = url;
  audio.onended = () => { if (onEnd) onEnd(); };
  audio.play().catch(() => {});
}

function highlightAyah(surah, ayah, reciter) {
  if (playingKey) {
    const prev = document.querySelector(`.ayah-span[data-key="${playingKey}"]`);
    if (prev) { prev.classList.remove('playing'); prev.classList.remove('selected'); }
  }
  const key = `${surah}_${ayah}`;
  playingKey = key;
  selectedAyahKey = key;
  applySelection();
  const el = document.querySelector(`.ayah-span[data-key="${key}"]`);
  if (el) {
    el.classList.add('playing');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// Sayfa (Başlat) modu - basit sıralı tekrarsız ──────────────────────────
function playNextAyah() {
  if (!isPlaying) return;
  if (playQueueIndex >= playQueue.length) { stopPlay(); return; }
  const item = playQueue[playQueueIndex];
  const reciter = 'Husary_128kbps_Mujawwad';

  // Sure 1. ayetinde euzu/besmele (sadece sayfa modunda)
  if (item.ayah === 1 && !basmalaPlayedForSurah.has(item.surah)) {
    basmalaPlayedForSurah.add(item.surah);
    if (item.surah === 1) {
      // Sure 1: euzu çal, besmele yok (ayet metninde zaten var)
      playAudioUrl(`https://everyayah.com/data/${reciter}/001000.mp3`, () => playCurrentAyah(item, reciter));
    } else if (item.surah === 9) {
      // Sure 9: euzu da besmele de yok
      playCurrentAyah(item, reciter);
    } else {
      // Diğer sureler: besmele çal
      playAudioUrl(`https://everyayah.com/data/${reciter}/001001.mp3`, () => playCurrentAyah(item, reciter));
    }
    return;
  }
  playCurrentAyah(item, reciter);
}

function playCurrentAyah(item, reciter) {
  if (!isPlaying) return;
  const surahStr = String(item.surah).padStart(3, '0');
  const ayahStr = String(item.ayah).padStart(3, '0');
  const url = `https://everyayah.com/data/${reciter}/${surahStr}${ayahStr}.mp3`;

  // Highlight
  if (playingKey) {
    const prev = document.querySelector(`.ayah-span[data-key="${playingKey}"]`);
    if (prev) { prev.classList.remove('playing'); prev.classList.remove('selected'); }
  }
  const key = `${item.surah}_${item.ayah}`;
  playingKey = key;
  selectedAyahKey = key;
  applySelection();
  const el = document.querySelector(`.ayah-span[data-key="${key}"]`);
  if (el) {
    el.classList.add('playing');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  audio.src = url;
  audio.play().catch(() => {});
  audio.onended = () => {
    playRepeatCurrent++;
    if (playRepeatCurrent < playRepeat) {
      audio.play().catch(() => {});
    } else {
      playRepeatCurrent = 0;
      playQueueIndex++;
      // Check if next ayah is on different page
      if (playQueueIndex < playQueue.length) {
        const next = playQueue[playQueueIndex];
        const nextKey = `${next.surah}_${next.ayah}`;
        const nextEl = document.querySelector(`.ayah-span[data-key="${nextKey}"]`);
        if (!nextEl) {
          // Find page for next ayah
          let targetPage = currentPage;
          for (const [pg, blocks] of Object.entries(pageMap)) {
            for (const block of blocks) {
              if (block.surahNumber === next.surah && block.ayahs.some(a => a.numberInSurah === next.ayah)) {
                targetPage = parseInt(pg);
                break;
              }
            }
          }
          if (targetPage !== currentPage) {
            loadPage(targetPage, { surah: next.surah, ayah: next.ayah }).then(() => {
              setTimeout(() => playNextAyah(), 300);
            });
            return;
          }
        }
        playNextAyah();
      } else {
        stopPlay();
      }
    }
  };
}

function applyOkuMode() {
  if (!okuMode) return;
  // Tüm seçili ayet aralığını bulanıklaştır
  for (let an = okuFrom; an <= okuTo; an++) {
    const key = `${okuSurah}_${an}`;
    const block = document.querySelector(`.ayah-block[data-key="${key}"]`);
    if (!block) continue;
    const span = block.querySelector('.ayah-span');
    if (!span) continue;
    if (an - okuFrom === okuCurrentAyah) {
      // Aktif ayet: blur ekle + kelimelere böl
      span.classList.remove('ayah-active-oku');
      wrapWordsForOku(span, key);
      block.classList.add('ayah-blur');
    } else if (an - okuFrom < okuCurrentAyah) {
      // Geçmiş ayetler: temiz göster
      block.classList.remove('ayah-blur');
    } else {
      // İlerideki ayetler: bulanık
      block.classList.add('ayah-blur');
    }
  }
  // Aktif ayetin ilk tıklamayı bekle
  activateOkuAyah();
}

function wrapWordsForOku(span, key) {
  // words.json'daki cardGroups mantığıyla birebir aynı gruplamayı kullan
  // renderWordMeal ile senkronize - her oku-word bir kart = bir kelime grubu

  const ARABIC_LETTER = /[\u0621-\u06D5]/;

  // 1. Ayet metnindeki Arapça kelimeleri al (vakıf filtreli)
  const rawText = span.textContent;
  const arTokens = rawText.split(/\s+/).filter(t => ARABIC_LETTER.test(t));

  // 2. words.json TR listesiyle aynı cardGroups mantığı
  const trWords = wordDataLoaded ? (wordData[key] || []) : [];

  // cardGroups: [{arParts:[...], tr:string, dbIdx:number}]
  const cardGroups = [];
  trWords.forEach((tr, i) => {
    const ar = arTokens[i] || '';
    const isStar = !tr || tr === '*';
    if (isStar && cardGroups.length > 0) {
      cardGroups[cardGroups.length - 1].arParts.push(ar);
    } else {
      cardGroups.push({ arParts: [ar], tr: isStar ? '' : tr, dbIdx: i });
    }
  });

  // DB'den fazla token varsa (eşleşmeyenler) son gruba ekle
  for (let i = trWords.length; i < arTokens.length; i++) {
    if (cardGroups.length > 0) cardGroups[cardGroups.length-1].arParts.push(arTokens[i]);
    else cardGroups.push({ arParts: [arTokens[i]], tr: '', dbIdx: i });
  }

  // 3. Her grup için HTML oluştur - bir oku-word = bir grup
  const groupHtmlParts = cardGroups.map((g, idx) => {
    const arText = g.arParts.filter(Boolean).join(' ');
    if (!arText) return '';
    return `<span class="oku-word blurred" data-widx="${idx}" data-dbidx="${g.dbIdx}" data-tr="${(g.tr || '').replace(/"/g, '&quot;')}" style="filter:blur(5px);display:inline;">${arText}</span>`;
  }).filter(Boolean);

  span.innerHTML = groupHtmlParts.join(' ');
  span.style.filter = 'none';
  span.onclick = (e) => {
    e.stopPropagation();
    okuRevealNextWord(key, span);
  };
}

function activateOkuAyah() {
  const an = okuFrom + okuCurrentAyah;
  if (an > okuTo) { okuMode = false; return; }
  const key = `${okuSurah}_${an}`;
  const block = document.querySelector(`.ayah-block[data-key="${key}"]`);
  if (block) {
    // Aktif ayet bu sayfada - scroll et ve kenarlık ekle
    block.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const span = block.querySelector('.ayah-span');
    if (span) span.classList.add('oku-active-border');
  }
  // Aktif ayet başka sayfadaysa - sadece bulanıklık uygulandı, scroll yok
}

function okuRevealNextWord(key, span) {
  const words = span.querySelectorAll('.oku-word.blurred');
  if (words.length === 0) return;
  // İlk bulanık kelimeyi netleştir
  const revealedWord = words[0];
  revealedWord.style.filter = 'none';
  revealedWord.classList.remove('blurred');
  revealedWord.classList.add('revealed');

  // data-tr attribute'undan direkt oku (cardGroups mantığında kaydedildi)
  const tr = revealedWord.dataset.tr || '';
  if (tr) showOkuTooltip(revealedWord, tr);

  // Tüm kelimeler netleştiyse ayeti seslendir ve sıradakine geç
  const remaining = span.querySelectorAll('.oku-word.blurred');
  if (remaining.length === 0) {
    const an = okuFrom + okuCurrentAyah;
    span.classList.remove('oku-active-border');
    const reciter = settings.reciter || 'Husary_128kbps_Mujawwad';
    playOkuAudio(ayahUrl(okuSurah, an, reciter), () => {
      okuCurrentAyah++;
      const nextAn = okuFrom + okuCurrentAyah;
      if (nextAn <= okuTo) {
        // Sıradaki ayet bu sayfada mı?
        const nextKey = `${okuSurah}_${nextAn}`;
        const nextEl = document.querySelector(`.ayah-block[data-key="${nextKey}"]`);
        if (!nextEl) {
          // Farklı sayfada - sayfayı geç
          let targetPage = currentPage;
          for (const [pg, blocks] of Object.entries(pageMap)) {
            for (const block of blocks) {
              if (block.surahNumber === okuSurah && block.ayahs.some(a => a.numberInSurah === nextAn)) {
                targetPage = parseInt(pg);
                break;
              }
            }
          }
          loadPage(targetPage, null, true).then(() => {
            applyOkuMode();
          });
        } else {
          applyOkuMode();
        }
      } else {
        okuMode = false;
      }
    });
  }
}

// ===================== YAZ MODU =====================
let yazMode = false;
let yazHintOpen = false; // ipucu modu
let yazSurah = 0, yazFrom = 0, yazTo = 0;
let yazCurrentAyah = 0;
let yazCurrentCharIdx = 0; // sıradaki netleşecek harf index (sağdan sola = chars dizisinin başı)
let yazCurrentChars = []; // aktif ayetin harf listesi [{char, elId}]

// Arapça base harf eşleşmesi (harekeli/harfli varyantlar)
const ARABIC_BASE_MAP = {
  'ا':'ا','أ':'ا','إ':'ا','آ':'ا','ٱ':'ا',
  'ب':'ب','ت':'ت','ث':'ث','ج':'ج','ح':'ح','خ':'خ',
  'د':'د','ذ':'ذ','ر':'ر','ز':'ز','س':'س','ش':'ش',
  'ص':'ص','ض':'ض','ط':'ط','ظ':'ظ','ع':'ع','غ':'غ',
  'ف':'ف','ق':'ق','ك':'ك','ك':'ك','ل':'ل','م':'م',
  'ن':'ن','ه':'ه','و':'و','ي':'ي','ى':'ى',
  'ة':'ه','ؤ':'و','ئ':'ي','ء':'ء',

  'لا':'لا','لأ':'لا','لإ':'لا','لآ':'لا',
};
function baseChar(c) { return ARABIC_BASE_MAP[c] || c; }

document.getElementById('apply-yaz').addEventListener('click', () => {
  // Mod aktifse iptal et
  if (yazMode) {
    endYazMode();
    document.querySelectorAll('.ayah-blur').forEach(el => el.classList.remove('ayah-blur'));
    document.querySelectorAll('.oku-active-border').forEach(el => el.classList.remove('oku-active-border'));
    document.getElementById('apply-yaz-label').textContent = 'Uygula';
    closeModal('ezber-modal');
    return;
  }
  const surahVal = document.getElementById('yaz-surah-select').value;
  const fromVal = parseInt(document.getElementById('yaz-from').value) || null;
  const toVal = parseInt(document.getElementById('yaz-to').value) || null;
  if (!surahVal || !fromVal || !toVal) { alert('Lütfen sure, başlangıç ve bitiş ayetini seçin.'); return; }
  yazSurah = parseInt(surahVal);
  yazFrom = fromVal;
  yazTo = toVal;
  closeModal('ezber-modal');
  resetEzberForm();
  document.getElementById('apply-yaz-label').textContent = 'Modu Kapat';

  let targetPage = surahFirstPage[yazSurah] ? surahFirstPage[yazSurah].page : 1;
  for (const [pg, blocks] of Object.entries(pageMap)) {
    for (const block of blocks) {
      if (block.surahNumber === yazSurah && block.ayahs.some(a => a.numberInSurah === yazFrom)) {
        targetPage = parseInt(pg); break;
      }
    }
  }
  loadPage(targetPage, { surah: yazSurah, ayah: yazFrom }, true).then(() => {
    yazMode = true;
    yazCurrentAyah = 0;
    applyYazMode();
  });
});

function applyYazMode() {
  if (!yazMode) return;
  // Ayet aralığını bulanıklaştır
  for (let an = yazFrom; an <= yazTo; an++) {
    const key = `${yazSurah}_${an}`;
    const block = document.querySelector(`.ayah-block[data-key="${key}"]`);
    if (!block) continue;
    const span = block.querySelector('.ayah-span');
    if (!span) continue;
    const offset = an - yazFrom;
    if (offset === yazCurrentAyah) {
      wrapCharsForYaz(span, key);
      block.classList.add('ayah-blur');
      span.style.filter = 'none';
    } else if (offset < yazCurrentAyah) {
      block.classList.remove('ayah-blur');
    } else {
      block.classList.add('ayah-blur');
    }
  }
  activateYazAyah();
  const kbd = document.getElementById('yaz-keyboard');
  kbd.classList.add('open');
  // Klavye yüksekliği kadar içerik alanına padding ekle (içerik gizlenmesin)
  requestAnimationFrame(() => {
    const kbdH = kbd.offsetHeight;
    document.getElementById('quran-content').style.paddingBottom = kbdH + 'px';
  });
}

function wrapCharsForYaz(span, key) {
  const text = span.textContent; // ham metin, hareke dahil
  // Karakter dizisini oluştur - her baz harf + harekelerini bir birim yap
  // Arapça harf (U+0600-U+06FF, U+0750-U+077F) + ardındaki harekeler
  // Gerçek Arapça harfler - vakıf/tilavet işaretleri (U+06D6-U+06ED) hariç
  const ARABIC_LETTER = /[\u0621-\u063A\u0641-\u064A\u0671-\u06D5]/;
  const DIACRITIC = /[ؐ-ًؚ-ٰٟۖ-ۜ۟-۪ۤۧۨ-ۭ]/;

  let units = []; // {text: string} her biri bir harf+hareke birimi
  let i = 0;
  while (i < text.length) {
    const ch = text[i];
    if (ARABIC_LETTER.test(ch)) {
      let unit = ch;
      i++;
      while (i < text.length && DIACRITIC.test(text[i])) {
        unit += text[i]; i++;
      }
      units.push({ text: unit, base: ch });
    } else if (DIACRITIC.test(ch)) {
      // Hareke veya tilavet işareti - önceki birime ekle (görsel)
      if (units.length > 0) units[units.length-1].text += ch;
      i++;  // ilerle
    } else {
      // Boşluk, noktalama veya diğer - önceki birime ekle ya da atla
      if (units.length > 0) units[units.length-1].text += ch;
      i++;
    }
  }

  // HTML oluştur - sağdan sola sıra, index 0 = en sağdaki harf
  let html = '';
  units.forEach((u, idx) => {
    html += `<span class="yaz-char blurred" data-cidx="${idx}" style="filter:blur(5px)">${u.text}</span>`;
  });
  span.innerHTML = html;

  // yazCurrentChars = units dizisi (sağdan sola = index 0'dan başla)
  yazCurrentChars = units;
  yazCurrentCharIdx = 0;
}

function activateYazAyah() {
  const an = yazFrom + yazCurrentAyah;
  if (an > yazTo) { endYazMode(); return; }
  const key = `${yazSurah}_${an}`;
  const block = document.querySelector(`.ayah-block[data-key="${key}"]`);
  if (block) {
    // Aktif ayet bu sayfada - scroll et ve kenarlık ekle
    block.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const span = block.querySelector('.ayah-span');
    if (span) span.classList.add('oku-active-border');
  }
  // Aktif ayet başka sayfadaysa - klavye açık kalır, geri dönünce devam eder
}

function getYazCurrentWordTr() {
  if (!wordDataLoaded || !yazCurrentChars.length) return null;
  const an = yazFrom + yazCurrentAyah;
  const key = `${yazSurah}_${an}`;
  const trWords = wordData[key];
  if (!trWords) return null;

  // yazCurrentChars: wrapCharsForYaz'daki unit listesi
  // Her unit = bir base harf + harekeler (DIACRITIC dahil değil ayrı)
  // yazCurrentCharIdx = şu anki unit indeksi

  // Ayet tokenlarındaki unit sayısını wrapCharsForYaz ile AYNI mantıkla hesapla:
  // ARABIC_LETTER (base harf) = yeni unit başlatır
  // DIACRITIC = önceki birime eklenir, unit sayımına girmez
  const ARABIC_LETTER = /[\u0621-\u06D5]/;
  const DIACRITIC = /[\u0600-\u0605\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/;

  function countUnitsInToken(tok) {
    let count = 0;
    for (const ch of tok) {
      if (ARABIC_LETTER.test(ch) && !DIACRITIC.test(ch)) count++;
    }
    return count;
  }

  // Span'ın orijinal textContent'inden token listesi
  const span = document.querySelector(`.ayah-block[data-key="${key}"] .ayah-span`);
  if (!span) return null;

  // wrapCharsForYaz çağrılmışsa span içi değişmiş - data-cidx spanlardan base harf sayısını al
  // ya da yazCurrentChars dizisinden direkt kullan (daha güvenilir)
  // yazCurrentChars[i].base = o unit'in base harfi
  // Ayet tokenlarını orijinal metnden al
  // span.textContent wrapCharsForYaz sonrası da doğru metni verir
  const rawText = span.textContent;
  const arTokens = rawText.split(/\s+/).filter(t => ARABIC_LETTER.test(t));

  // Her token'daki unit sayısını hesapla (wrapCharsForYaz mantığıyla)
  let charSum = 0;
  let tokenIdx = 0;
  for (let ti = 0; ti < arTokens.length; ti++) {
    const unitCount = countUnitsInToken(arTokens[ti]);
    if (yazCurrentCharIdx < charSum + unitCount) {
      tokenIdx = ti;
      break;
    }
    charSum += unitCount;
    tokenIdx = ti; // son token fallback
  }

  // tokenIdx → cardGroups mantığıyla doğru TR bul
  // * olan TR önceki gruba dahildir (arCount++)
  const cardGroups = [];
  let arTokenPos = 0;
  for (let di = 0; di < trWords.length; di++) {
    const tr = trWords[di];
    const isStar = (tr === '*' || !tr);
    if (isStar && cardGroups.length > 0) {
      cardGroups[cardGroups.length - 1].arCount++;
    } else {
      cardGroups.push({ tr: tr, arCount: 1, startToken: arTokenPos });
    }
    arTokenPos++;
  }
  // tokenIdx hangi cardGroup'a ait?
  for (const g of cardGroups) {
    if (tokenIdx >= g.startToken && tokenIdx < g.startToken + g.arCount) {
      return g.tr || null;
    }
  }
  return cardGroups.length ? cardGroups[cardGroups.length - 1].tr : null;
}

function showYazHint(anchorEl) {
  const tr = getYazCurrentWordTr();
  const old = document.getElementById('yaz-hint-tip');
  if (old) old.remove();
  if (!tr || !yazHintOpen) return;

  const tipEl = document.createElement('div');
  tipEl.id = 'yaz-hint-tip';
  tipEl.textContent = tr;
  tipEl.style.cssText = `
    position: fixed; z-index: 500; pointer-events: none;
    background: #1a3a2a; color: #e8d9b0;
    font-family: sans-serif; font-size: 13px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px;
    border: 1px solid var(--gold);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    white-space: nowrap;
  `;
  document.body.appendChild(tipEl);

  // Aktif yazılan harfin span elementini bul ve üstünde konumlandır
  const an = yazFrom + yazCurrentAyah;
  const key = `${yazSurah}_${an}`;
  const span = document.querySelector(`.ayah-block[data-key="${key}"] .ayah-span`);
  // Mevcut harf elementini bul
  const charEl = span ? span.querySelector(`[data-cidx="${yazCurrentCharIdx}"]`) : null;
  // Kelime başlangıç elementini bul (mevcut kelime grubunun ilk harfi)
  let targetEl = charEl || span;

  if (targetEl) {
    const rect = targetEl.getBoundingClientRect();
    const tipW = tipEl.offsetWidth || 100;
    let left = rect.left + rect.width / 2 - tipW / 2;
    left = Math.max(6, Math.min(left, window.innerWidth - tipW - 6));
    const top = rect.top - tipEl.offsetHeight - 8;
    tipEl.style.left = left + 'px';
    tipEl.style.top = (top < 6 ? rect.bottom + 4 : top) + 'px';
  }

  if (anchorEl) {
    clearTimeout(tipEl._timer);
    tipEl._timer = setTimeout(() => tipEl.remove(), 2500);
  }
}

function endYazMode() {
  yazMode = false;
  yazHintOpen = false;
  const hintBtn = document.getElementById('yaz-hint-btn');
  if (hintBtn) { hintBtn.textContent = '💡'; hintBtn.style.background = '#3a5a2a'; }
  document.getElementById('yaz-keyboard').classList.remove('open');
  document.getElementById('quran-content').style.paddingBottom = '';
  const lbl = document.getElementById('apply-yaz-label');
  if (lbl) lbl.textContent = 'Uygula';
}

// Klavye tuş olayı
document.querySelectorAll('.yaz-key').forEach(key => {
  key.addEventListener('click', () => {
    if (!yazMode) return;
    const pressed = key.dataset.char;
    if (pressed === 'SPACE') { yazCheckChar(' '); return; }
    yazCheckChar(pressed);
  });
});

function yazCheckChar(pressed) {
  if (!yazCurrentChars.length) return;
  const target = yazCurrentChars[yazCurrentCharIdx];
  if (!target) return;

  // İpucu toggle
  if (pressed === 'HINT') {
    yazHintOpen = !yazHintOpen;
    const hintBtn = document.getElementById('yaz-hint-btn');
    if (hintBtn) {
      hintBtn.textContent = '💡';
      hintBtn.style.background = yazHintOpen ? '#6a4a10' : '#3a5a2a';
      hintBtn.style.borderColor = yazHintOpen ? '#c87533' : '#6a9a4a';
    }
    if (yazHintOpen) showYazHint(); // hemen göster
    return;
  }

  // Base harf karşılaştırması
  const pressedBase = baseChar(pressed);
  const targetBase = baseChar(target.base);

  if (pressedBase === targetBase || pressed === target.base) {
    // Doğru harf - netleştir
    const an = yazFrom + yazCurrentAyah;
    const key = `${yazSurah}_${an}`;
    const span = document.querySelector(`.ayah-block[data-key="${key}"] .ayah-span`);
    if (span) {
      const charEl = span.querySelector(`[data-cidx="${yazCurrentCharIdx}"]`);
      if (charEl) { charEl.style.filter = 'none'; charEl.classList.remove('blurred'); charEl.classList.add('revealed'); }
    }
    yazCurrentCharIdx++;

    // İpucu açıksa tooltip güncelle
    if (yazHintOpen) {
      // Mevcut kelime hala devam ediyorsa tooltip güncelle
      // Kelime tamamlandıysa sıradaki kelimeyi göster (aşağıda kontrol edilecek)
      const tipEl = document.getElementById('yaz-hint-tip');
      if (tipEl) tipEl.remove();
      showYazHint(true);
    }

    // Tüm harfler netleştiyse
    if (yazCurrentCharIdx >= yazCurrentChars.length) {
      const reciter = settings.reciter || 'Husary_128kbps_Mujawwad';
      if (span) span.classList.remove('oku-active-border');
      playOkuAudio(ayahUrl(yazSurah, an, reciter), () => {
        yazCurrentAyah++;
        yazCurrentCharIdx = 0;
        yazCurrentChars = [];
        const nextAn = yazFrom + yazCurrentAyah;
        if (nextAn <= yazTo) {
          const nextKey = `${yazSurah}_${nextAn}`;
          const nextEl = document.querySelector(`.ayah-block[data-key="${nextKey}"]`);
          if (!nextEl) {
            let targetPage = currentPage;
            for (const [pg, blocks] of Object.entries(pageMap)) {
              for (const block of blocks) {
                if (block.surahNumber === yazSurah && block.ayahs.some(a => a.numberInSurah === nextAn)) {
                  targetPage = parseInt(pg); break;
                }
              }
            }
            loadPage(targetPage, null, true).then(() => applyYazMode());
          } else {
            applyYazMode();
          }
        } else {
          endYazMode();
        }
      });
    }
  }
  // Yanlış harf: hiçbir şey yapma
}

// ===================== SWIPE / DRAG =====================
const mainEl = document.getElementById('main');
mainEl.addEventListener('touchstart', e => {
  if (e.touches.length > 1) { isSwiping = false; return; } // pinch zoom - dokunma
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
  isSwiping = true;
}, { passive: true });
mainEl.addEventListener('touchmove', e => {
  if (e.touches.length > 1) { isSwiping = false; } // pinch başladıysa swipe iptal
}, { passive: true });
mainEl.addEventListener('touchend', e => {
  if (!isSwiping) return;
  isSwiping = false;
  if (e.changedTouches.length > 1) return;
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    handleSwipe(dx > 0 ? 'ltr' : 'rtl');
  }
}, { passive: true });

// Mouse drag
let mouseDown = false, mouseStartX = 0;
mainEl.addEventListener('mousedown', e => {
  mouseDown = true;
  mouseStartX = e.clientX;
});
document.addEventListener('mouseup', e => {
  if (!mouseDown) return;
  const dx = e.clientX - mouseStartX;
  mouseDown = false;
  if (Math.abs(dx) > 80) handleSwipe(dx > 0 ? 'ltr' : 'rtl');
});

function handleSwipe(dir) {
  // dir 'ltr' = soldan sağa = sonraki sayfa (Arapça'da)
  // dir 'rtl' = sağdan sola = önceki sayfa
  // Mod aktifken swipe serbest - loadPage içinde mod korunur
  if (dir === 'ltr') {
    const next = currentPage >= 604 ? 1 : currentPage + 1;
    loadPage(next, okuMode || yazMode ? null : 'first');
  } else {
    const prev = currentPage <= 1 ? 604 : currentPage - 1;
    loadPage(prev, okuMode || yazMode ? null : 'first');
  }
}

init();

// ===================== WAKE LOCK =====================
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      await navigator.wakeLock.request('screen');
    } catch(e) {}
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
requestWakeLock();
